name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 10 */5 * *'  # Every 5 days at 10:00 UTC
  workflow_dispatch:          # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -sf \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/routes?select=id&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
